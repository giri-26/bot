<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> AI Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ═══════════════════════ SIDEBAR ═══════════════════════ -->
<aside id="sidebar" style="
  position:fixed; top:0; left:0; height:100vh; width:260px;
  background:var(--sidebar-bg); border-right:1px solid var(--border);
  display:flex; flex-direction:column; gap:0; z-index:200;
  transform:translateX(0); transition:transform .3s ease;
">
  <!-- Logo -->
  <div style="padding:22px 20px 18px; border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:36px;height:36px;background:var(--grad);border-radius:10px;
                  display:flex;align-items:center;justify-content:center;font-size:1.1rem;">🤖</div>
      <div>
        <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:1rem;color:var(--text);">SimpleChat</div>
        <div style="font-size:.68rem;color:var(--muted);">Local AI Assistant</div>
      </div>
    </div>
  </div>

  <!-- Model selector -->
  <div style="padding:14px 16px; border-bottom:1px solid var(--border);">
    <label style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">Model</label>
    <select id="model-sel" style="width:100%;margin-top:6px;background:var(--input-bg);
      border:1px solid var(--border);color:var(--text);border-radius:8px;
      padding:8px 10px;font-size:.85rem;font-family:'Sora',sans-serif;cursor:pointer;outline:none;">
      <option>Loading...</option>
    </select>
  </div>

  <!-- Mode -->
  <div style="padding:14px 16px; border-bottom:1px solid var(--border);">
    <label style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">Mode</label>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;" id="mode-btns">
      <button onclick="setMode('general')" class="mode-btn active" data-mode="general">🌐 General</button>
      <button onclick="setMode('study')"   class="mode-btn"        data-mode="study">📚 Study</button>
      <button onclick="setMode('coding')"  class="mode-btn"        data-mode="coding">💻 Coding</button>
    </div>
  </div>

  <!-- Language -->
  <div style="padding:14px 16px; border-bottom:1px solid var(--border);">
    <label style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">🌍 Language</label>
    <select id="lang-sel" style="width:100%;margin-top:6px;background:var(--input-bg);
      border:1px solid var(--border);color:var(--text);border-radius:8px;
      padding:8px 10px;font-size:.85rem;font-family:'Sora',sans-serif;cursor:pointer;outline:none;">
      <option>English</option><option>Tamil</option><option>Hindi</option>
      <option>French</option><option>Spanish</option><option>German</option>
      <option>Japanese</option><option>Arabic</option><option>Chinese</option>
    </select>
  </div>

  <!-- Toggles -->
  <div style="padding:14px 16px; border-bottom:1px solid var(--border);">
    <label style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">Settings</label>
    <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px;">
      <label class="toggle-row">
        <span>⚡ Short Answer</span>
        <div class="toggle-wrap"><input type="checkbox" id="short-toggle"><span class="toggle-slider"></span></div>
      </label>
      <label class="toggle-row">
        <span>📊 Step-by-Step</span>
        <div class="toggle-wrap"><input type="checkbox" id="step-toggle"><span class="toggle-slider"></span></div>
      </label>
      <label class="toggle-row">
        <span>🔊 Voice Output</span>
        <div class="toggle-wrap"><input type="checkbox" id="tts-toggle"><span class="toggle-slider"></span></div>
      </label>
    </div>
  </div>

  <!-- Actions -->
  <div style="padding:14px 16px; flex:1; display:flex; flex-direction:column; gap:6px;">
    <label style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">Actions</label>
    <button class="side-btn" onclick="showNotes()">🧾 Notes</button>
    <button class="side-btn" onclick="showPinned()">📌 Pinned</button>
    <button class="side-btn" onclick="saveChat()">💾 Save Chat</button>
    <button class="side-btn" onclick="clearChat()">🧹 Clear Chat</button>
  </div>

  <!-- Theme toggle -->
  <div style="padding:14px 16px; border-top:1px solid var(--border);">
    <button onclick="toggleTheme()" class="side-btn" id="theme-btn">🌙 Dark Mode</button>
  </div>
</aside>

<!-- ═══════════════════════ MAIN AREA ═══════════════════════ -->
<div id="main" style="margin-left:260px; display:flex; flex-direction:column; height:100vh; transition:margin .3s;">

  <!-- Top bar (mobile) -->
  <div id="topbar" style="display:none; align-items:center; gap:12px; padding:12px 16px;
       background:var(--sidebar-bg); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100;">
    <button onclick="toggleSidebar()" style="background:none;border:none;color:var(--text);font-size:1.3rem;cursor:pointer;">☰</button>
    <span style="font-family:'Sora',sans-serif;font-weight:700;font-size:1rem;background:var(--grad);
                 -webkit-background-clip:text;-webkit-text-fill-color:transparent;">OllamaChat</span>
  </div>

  <!-- Chat messages -->
  <div id="chat" style="flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;"></div>

  <!-- Image preview -->
  <div id="img-preview" style="display:none; padding:8px 20px; background:var(--sidebar-bg);
       border-top:1px solid var(--border); align-items:center; gap:10px;">
    <img id="img-thumb" src="" alt="preview" style="height:56px;border-radius:8px;border:2px solid var(--accent);" />
    <span style="font-size:.82rem;color:var(--muted);">Image attached</span>
    <button onclick="clearImage()" style="margin-left:auto;background:var(--danger);color:#fff;
      border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:.8rem;">✕ Remove</button>
  </div>

  <!-- Input bar -->
  <div id="input-bar" style="padding:14px 20px; background:var(--sidebar-bg);
       border-top:1px solid var(--border); display:flex; align-items:flex-end; gap:8px;">

    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleImage(event)" />

    <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Upload Image">🖼️</button>
    <button class="icon-btn" id="voice-btn" onclick="toggleVoice()" title="Voice Input">🎤</button>
    <button class="icon-btn" onclick="openImageGen()" title="Generate Image">🎨</button>

    <textarea id="msg-input"
      placeholder="Type a message... (Enter to send)"
      rows="1"
      style="flex:1;background:var(--input-bg);border:1.5px solid var(--border);color:var(--text);
             border-radius:12px;padding:10px 14px;font-size:.9rem;font-family:'Sora',sans-serif;
             resize:none;min-height:44px;max-height:130px;outline:none;transition:border .2s;line-height:1.5;"
      oninput="autoResize(this)"
      onkeydown="handleKey(event)">
    </textarea>

    <button class="icon-btn primary" id="send-btn" onclick="sendMessage()" title="Send">➤</button>
  </div>
</div>

<!-- ═══════════════════════ MODALS ═══════════════════════ -->

<!-- Notes Modal -->
<div id="notes-modal" class="modal-overlay" onclick="closeModal('notes-modal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h2 style="font-family:'Sora';font-size:1.1rem;">🧾 My Notes</h2>
      <button onclick="closeModal('notes-modal')" style="background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;">✕</button>
    </div>
    <textarea id="notes-area" placeholder="Write your notes here..."
      style="width:100%;height:200px;background:var(--input-bg);border:1px solid var(--border);
             color:var(--text);border-radius:10px;padding:12px;font-size:.88rem;
             font-family:'Sora',sans-serif;resize:vertical;outline:none;"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button onclick="generateNotes()" class="modal-btn primary">✨ Generate from Chat</button>
      <button onclick="copyNotes()" class="modal-btn">📋 Copy</button>
      <button onclick="clearNotes()" class="modal-btn danger">🗑 Clear</button>
    </div>
  </div>
</div>

<!-- Pinned Modal -->
<div id="pinned-modal" class="modal-overlay" onclick="closeModal('pinned-modal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h2 style="font-family:'Sora';font-size:1.1rem;">📌 Pinned Messages</h2>
      <button onclick="closeModal('pinned-modal')" style="background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;">✕</button>
    </div>
    <div id="pinned-list" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;"></div>
    <p id="no-pins" style="color:var(--muted);text-align:center;font-size:.88rem;display:none;">No pinned messages yet.</p>
  </div>
</div>

<!-- Image Generation Modal -->
<div id="imggen-modal" class="modal-overlay" onclick="closeModal('imggen-modal')">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <h2 style="font-family:'Sora';font-size:1.1rem;">🎨 Generate Image</h2>
      <button onclick="closeModal('imggen-modal')" style="background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;">✕</button>
    </div>
    <input id="imggen-prompt" placeholder="Describe the image you want..."
      style="width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);
             border-radius:10px;padding:10px 14px;font-size:.9rem;font-family:'Sora',sans-serif;
             outline:none;margin-bottom:10px;" />
    <button onclick="generateImage()" class="modal-btn primary" style="width:100%;">✨ Generate</button>
    <div id="imggen-result" style="margin-top:12px;text-align:center;"></div>
  </div>
</div>

<!-- Toast notification -->
<div id="toast" style="position:fixed;bottom:24px;right:24px;background:var(--accent);color:#fff;
  border-radius:10px;padding:10px 18px;font-size:.85rem;font-family:'Sora',sans-serif;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;"></div>

<script src="app.js"></script>
</body>
</html>
